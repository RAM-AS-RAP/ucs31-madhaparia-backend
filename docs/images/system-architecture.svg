<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" role="img" aria-labelledby="title description">
  <title id="title">Respiratory Health Awareness System — V3 Architecture</title>
  <desc id="description">Patients and administrators use separate React interfaces connected to the FastAPI backend. Bilingual symptom mapping and patient confirmation precede red-flag safety checks. Confirmed red flags bypass inference and return urgent guidance; other evidence goes to the V3 partial-evidence research model. PostgreSQL stores accounts, assessment snapshots, feedback, catalogues and audit records. A public safety check can operate without a database or model. Research results are not diagnoses.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 9 4.5 0 9Z" fill="#64748b"/>
    </marker>
    <marker id="urgent-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 9 4.5 0 9Z" fill="#b91c1c"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .heading { font-size: 18px; font-weight: 700; fill: #163d79; }
      .body { font-size: 16px; fill: #334155; }
      .label { font-size: 14px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .card { fill: #fff; stroke: #9db6dd; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1440" height="890" rx="20" fill="#f5f8fd"/>
  <text x="48" y="54" font-size="28" font-weight="700" fill="#102b50">Respiratory Health Awareness System</text>
  <text x="48" y="84" font-size="17" fill="#475569">System architecture · V3 partial-evidence research · 34 features / 21 classes</text>
  <rect x="1150" y="31" width="242" height="34" rx="17" fill="#e0eaff"/>
  <text x="1271" y="53" text-anchor="middle" font-size="13" font-weight="700" fill="#163d79">RESEARCH — NOT DIAGNOSIS</text>

  <!-- Connections are drawn before cards so their endpoints stay behind borders. -->
  <path class="line" d="M174 262H220" marker-start="url(#arrow)"/>
  <path class="line" d="M174 554H220" marker-start="url(#arrow)"/>
  <path class="line" d="M460 262H550" marker-start="url(#arrow)"/>
  <path class="line" d="M460 554H550" marker-start="url(#arrow)"/>
  <text class="label" x="505" y="231" text-anchor="middle">HTTPS</text>
  <text class="label" x="505" y="251" text-anchor="middle">/ JSON</text>
  <text class="label" x="505" y="524" text-anchor="middle">HTTPS</text>
  <text class="label" x="505" y="544" text-anchor="middle">/ JSON</text>
  <path class="line" d="M840 242H934V211H980" marker-start="url(#arrow)"/>
  <path class="line" d="M840 368H980" marker-start="url(#arrow)"/>
  <path class="line" d="M840 484H934V546H980" marker-start="url(#arrow)"/>
  <path class="line" d="M840 626H912V738H980" marker-start="url(#arrow)"/>
  <text class="label" x="902" y="185" text-anchor="middle">Map + confirm</text>
  <text class="label" x="910" y="354" text-anchor="middle">Safety first</text>
  <text class="label" x="907" y="462" text-anchor="middle">Non-urgent</text>
  <text class="label" x="902" y="649" text-anchor="middle">Persist / read</text>

  <!-- Actors and separate frontend applications. -->
  <rect class="card" x="48" y="205" width="126" height="114" rx="14"/>
  <circle cx="111" cy="236" r="13" fill="#2563eb"/>
  <path d="M86 279V271a25 22 0 0 1 50 0v8Z" fill="#2563eb"/>
  <text class="heading" x="111" y="303" text-anchor="middle" font-size="15">PATIENT</text>
  <rect class="card" x="220" y="172" width="240" height="180" rx="14"/>
  <rect x="236" y="188" width="208" height="33" rx="7" fill="#eaf1ff"/>
  <text class="heading" x="340" y="210" text-anchor="middle">PATIENT FRONTEND</text>
  <text class="label" x="240" y="248">React web application</text>
  <text class="body" x="240" y="278">Describe + confirm symptoms</text>
  <text class="body" x="240" y="303">View guidance + own history</text>
  <text class="body" x="240" y="328">Submit feedback</text>

  <rect class="card" x="48" y="497" width="126" height="114" rx="14"/>
  <circle cx="111" cy="528" r="13" fill="#2563eb"/>
  <path d="M86 571V563a25 22 0 0 1 50 0v8Z" fill="#2563eb"/>
  <text x="111" y="595" text-anchor="middle" font-size="13" font-weight="700" fill="#163d79">ADMINISTRATOR</text>
  <rect class="card" x="220" y="464" width="240" height="180" rx="14"/>
  <rect x="236" y="480" width="208" height="33" rx="7" fill="#eaf1ff"/>
  <text class="heading" x="340" y="502" text-anchor="middle">ADMIN FRONTEND</text>
  <text class="label" x="240" y="540">React administration dashboard</text>
  <text class="body" x="240" y="570">Manage patient accounts</text>
  <text class="body" x="240" y="595">Review feedback + diagnostics</text>
  <text class="body" x="240" y="620">Maintain aliases + descriptions</text>

  <!-- Backend services. -->
  <rect class="card" x="550" y="180" width="290" height="490" rx="18"/>
  <rect x="568" y="198" width="254" height="65" rx="10" fill="#eaf1ff"/>
  <text x="695" y="227" text-anchor="middle" font-size="23" font-weight="700" fill="#163d79">FASTAPI BACKEND</text>
  <text class="label" x="695" y="249" text-anchor="middle">Python · REST API</text>
  <text class="body" x="574" y="301">Authentication + role checks</text>
  <text class="body" x="574" y="331">Accounts + password recovery</text>
  <line x1="574" y1="351" x2="816" y2="351" stroke="#dbe4f1"/>
  <text class="body" x="574" y="386">Symptom confirmation</text>
  <text class="body" x="574" y="416">Explicit patient corrections</text>
  <text class="body" x="574" y="446">Safety before model selection</text>
  <text class="body" x="574" y="476">Versioned assessments</text>
  <line x1="574" y1="496" x2="816" y2="496" stroke="#dbe4f1"/>
  <text class="body" x="574" y="531">Patient-owned history</text>
  <text class="body" x="574" y="561">Feedback + admin management</text>
  <text class="body" x="574" y="591">Database + model readiness</text>
  <text class="label" x="574" y="640">Legacy V1/V2 history stays readable</text>

  <!-- Mapping, safety, inference and persistence. -->
  <rect class="card" x="980" y="133" width="412" height="145" rx="14"/>
  <text class="heading" x="1002" y="165">BILINGUAL SYMPTOM MAPPING</text>
  <text class="body" x="1002" y="195">English / Kiswahili / mixed-language text</text>
  <text class="body" x="1002" y="220">SQL catalogue, aliases + fuzzy matching</text>
  <text class="body" x="1002" y="245">Reported state, subject + evidence context</text>

  <rect x="980" y="302" width="412" height="133" rx="14" fill="#fff8f7" stroke="#e4a5a5" stroke-width="1.5"/>
  <text x="1002" y="334" font-size="18" font-weight="700" fill="#b91c1c">RED-FLAG SAFETY LAYER</text>
  <text class="body" x="1002" y="363">Check recognised, confirmed red flags</text>
  <text class="body" x="1002" y="388">Urgent guidance bypasses model inference</text>
  <text x="1002" y="414" font-size="14" font-weight="700" fill="#b91c1c">Not a complete emergency triage system</text>
  <path d="M1355 435V465" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#urgent-arrow)"/>
  <rect x="1178" y="466" width="214" height="30" rx="8" fill="#fee2e2"/>
  <text x="1285" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">RED FLAG → SKIP MODEL</text>

  <rect class="card" x="980" y="514" width="412" height="143" rx="14"/>
  <text class="heading" x="1002" y="546">V3 PARTIAL-EVIDENCE RESEARCH</text>
  <text class="body" x="1002" y="576">Assess supported confirmed evidence</text>
  <text class="body" x="1002" y="601">Tentative pattern only when policy permits</text>
  <text class="body" x="1002" y="626">Uncertain / unsupported cases stay unnamed</text>
  <text class="label" x="1002" y="647">Research scores ≠ patient disease probabilities</text>

  <rect class="card" x="980" y="681" width="412" height="125" rx="14"/>
  <text class="heading" x="1002" y="713">POSTGRESQL DATABASE</text>
  <text class="body" x="1002" y="741">Accounts, assessment snapshots + feedback</text>
  <text class="body" x="1002" y="766">Symptom catalogue, aliases + model versions</text>
  <text class="body" x="1002" y="791">Management records + audit references</text>

  <rect x="48" y="710" width="792" height="96" rx="12" fill="#eaf1ff"/>
  <text class="heading" x="68" y="740">INDEPENDENT SAFETY CHECK</text>
  <text class="body" x="68" y="766">POST /safety/check is public and does not depend on SQL or model availability.</text>
  <text class="label" x="68" y="790">The API must still be running. Saving a safety review requires authentication and a database.</text>
  <text x="720" y="852" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">Health awareness and research only · Not clinically validated · Not a diagnosis</text>
</svg>
