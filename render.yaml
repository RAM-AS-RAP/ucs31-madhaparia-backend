# Research demonstration only. The V3 model is not clinically validated.
# The Neon demo database is prepared separately; never point this at neondb.public.
services:
  - type: web
    runtime: python
    name: madhaparia-respiracare-v3-demo-api
    plan: free
    region: ohio
    repo: https://github.com/RAM-AS-RAP/ucs31-madhaparia-backend
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readiness
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://madhaparia-respiracare-v3-demo.onrender.com

  - type: web
    runtime: static
    name: madhaparia-respiracare-v3-demo
    repo: https://github.com/RAM-AS-RAP/ucs31-madhaparia-frontend
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://madhaparia-respiracare-v3-demo-api.onrender.com
